name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and publish
        run: |
          dotnet build src/SuperAgent.Console/SuperAgent.Console.csproj -c Release
          dotnet publish src/SuperAgent.Console/SuperAgent.Console.csproj -c Release -o ./publish

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./publish/**

      - name: Publish to GitHub Packages
        run: dotnet pack src/SuperAgent.Core/SuperAgent.Core.csproj -c Release
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
