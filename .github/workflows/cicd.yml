name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --nologo

      - name: Test
        run: dotnet test --no-build --nologo

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

      - name: Publish NuGet package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet pack src/SuperAgent.Core/SuperAgent.Core.csproj --configuration Release --output ./out
          dotnet push ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
